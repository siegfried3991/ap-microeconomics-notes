12", "m-s013", "m-s014", "m-s015", "m-s016", "x004"]}, {"id": "e05", "title": "The memo’s “positive” conclusion", "page": 1, "paragraph": 1, "sentenceIds": ["s017", "s018", "s019", "s020", "s021"], "questionIds": ["m-s017", "m-s018", "m-s019", "m-s020", "m-s021", "x005"]}, {"id": "e06", "title": "The whale analogy begins", "page": 1, "paragraph": 2, "sentenceIds": ["s022", "s023", "s024", "s025"], "questionIds": ["m-s022", "m-s023", "m-s024", "m-s025", "x006"]}, {"id": "e07", "title": "A personal anecdote presented as evidence", "page": 1, "paragraph": 2, "sentenceIds": ["s026", "s027", "s028", "s029"], "questionIds": ["m-s026", "m-s027", "m-s028", "m-s029", "x007"]}, {"id": "e08", "title": "Neutrality is declared insufficient", "page": 1, "paragraph": 2, "sentenceIds": ["s030", "s031", "s032", "s033"], "questionIds": ["m-s030", "m-s031", "m-s032", "m-s033", "x008"]}, {"id": "e09", "title": "The story’s success and its overlooked equipment", "page": 2, "paragraph": 2, "sentenceIds": ["s034"], "questionIds": ["m-s034", "x009"]}, {"id": "e10", "title": "Stop asking whether the work is right", "page": 2, "paragraph": 3, "sentenceIds": ["s035", "s036", "s037", "s038"], "questionIds": ["m-s035", "m-s036", "m-s037", "m-s038", "x010"]}, {"id": "e11", "title": "The path and the sledgehammer", "page": 2, "paragraph": 3, "sentenceIds": ["s039", "s040", "s041", "s042", "s043"], "questionIds": ["m-s039", "m-s040", "m-s041", "m-s042", "m-s043", "x011"]}, {"id": "e12", "title": "Letting “gravity” replace judgment", "page": 2, "paragraph": 3, "sentenceIds": ["s044", "s045", "s046"], "questionIds": ["m-s044", "m-s045", "m-s046", "x012"]}, {"id": "e13", "title": "Admiration that dismisses right and wrong", "page": 2, "paragraph": 3, "sentenceIds": ["s047", "s048", "s049", "s050"], "questionIds": ["m-s047", "m-s048", "m-s049", "m-s050", "x013"]}, {"id": "e14", "title": "Numbers as public proof", "page": 2, "paragraph": 3, "sentenceIds": ["s051", "s052", "s053"], "questionIds": ["m-s051", "m-s052", "m-s053", "x014"]}, {"id": "e15", "title": "An intrusive joke about the new baby", "page": 2, "paragraph": 3, "sentenceIds": ["s054", "s055", "s056", "s057"], "questionIds": ["m-s054", "m-s055", "m-s056", "m-s057", "x015"]}, {"id": "e16", "title": "Protection that sounds like surveillance", "page": 3, "paragraph": 4, "sentenceIds": ["s058", "s059"], "questionIds": ["m-s058", "m-s059", "x016"]}, {"id": "e17", "title": "Remorse dismissed as “boo-hooing”", "page": 3, "paragraph": 5, "sentenceIds": ["s060", "s061", "s062", "s063"], "questionIds": ["m-s060", "m-s061", "m-s062", "m-s063", "x017"]}, {"id": "e18", "title": "What Room 6 leaves unsaid", "page": 3, "paragraph": 5, "sentenceIds": ["s064", "s065", "s066"], "questionIds": ["m-s064", "m-s065", "m-s066", "x018"]}, {"id": "e19", "title": "Appealing to the people above", "page": 3, "paragraph": 5, "sentenceIds": ["s067", "s068", "s069"], "questionIds": ["m-s067", "m-s068", "m-s069", "x019"]}, {"id": "e20", "title": "Todd’s account of the meeting", "page": 3, "paragraph": 5, "sentenceIds": ["s070", "s071", "s072", "s073", "s074"], "questionIds": ["m-s070", "m-s071", "m-s072", "m-s073", "m-s074", "x020"]}, {"id": "e21", "title": "The worker can become the “shelf”", "page": 3, "paragraph": 5, "sentenceIds": ["s075", "s076"], "questionIds": ["m-s075", "m-s076", "x021"]}, {"id": "e22", "title": "A threat called an appeal “from the hip”", "page": 4, "paragraph": "5–6", "sentenceIds": ["s077", "s078"], "questionIds": ["m-s077", "m-s078", "x022"]}, {"id": "e23", "title": "The invitation to the office", "page": 4, "paragraph": 7, "sentenceIds": ["s079", "s080"], "questionIds": ["m-s079", "m-s080", "x023"]}, {"id": "e24", "title": "The empty reassurance and signature", "page": 4, "paragraph": 8, "sentenceIds": ["s081"], "questionIds": ["m-s081", "x024", "x025", "x026", "x027", "x028", "x029"]}], "sentences": [{"id": "s001", "text": "I would not like to characterize this as a plea, although it may start to sound like one (!).", "meaning": "Todd denies that he is pleading while admitting the memo may sound like a plea.", "options": ["Todd denies that he is pleading while admitting the memo may sound like a plea.", "Todd openly announces his resignation.", "Todd promises the memo contains no request.", "Todd says the staff wrote the memo."], "why": "The denial is immediately qualified by “although.” That tension makes the apparently confident manager sound anxious or defensive.", "section": "e01", "page": 1, "paragraph": 1}, {"id": "s002", "text": "The fact is, we have a job to do, we have tacitly agreed to do it (did you cash your last paycheck, I know I did, ha ha).", "meaning": "Todd treats accepting pay as an unspoken agreement to carry out the work.", "options": ["Todd treats accepting pay as an unspoken agreement to carry out the work.", "Todd says staff signed a new written contract today.", "Todd admits that nobody has been paid.", "Todd gives employees permission to reject all tasks."], "why": "The paycheck question supplies his supposed evidence for “tacitly agreed.” It is his argument for compliance, not proof that every worker consented to every task.", "section": "e01", "page": 1, "paragraph": 1}, {"id": "s003", "text": "We have also—to go a step further here—agreed to do the job well.", "meaning": "He extends the supposed agreement from doing the work to doing it well.", "options": ["He extends the supposed agreement from doing the work to doing it well.", "He concedes that quality does not matter.", "He announces a smaller workload.", "He says only the director must work carefully."], "why": "“Also” and “a step further” build on the previous claim; the memo increases the demands attached to accepting pay.", "section": "e01", "page": 1, "paragraph": 1}, {"id": "s004", "text": "Now we all know that one way to do a job poorly is to be negative about it.", "meaning": "Todd presents the idea that negativity harms performance as something everyone already accepts.", "options": ["Todd presents the idea that negativity harms performance as something everyone already accepts.", "Todd invites staff to debate whether the work is right.", "Todd states that negative numbers are banned.", "Todd proves that attitude is the only cause of poor performance."], "why": "“We all know” assumes agreement. “One way” does not logically establish that attitude is the sole cause of every performance problem.", "section": "e02", "page": 1, "paragraph": 1}, {"id": "s005", "text": "Say we need to clean a shelf.", "meaning": "He introduces a hypothetical, apparently ordinary cleaning job.", "options": ["He introduces a hypothetical, apparently ordinary cleaning job.", "He identifies the exact nature of Room 6.", "He says every worker is employed as a domestic cleaner.", "He reports a completed cleaning task."], "why": "“Say” sets up an example rather than reporting an event. Its ordinary appearance matters when “shelf” later acquires a more disturbing meaning.", "section": "e02", "page": 1, "paragraph": 1}, {"id": "s006", "text": "Let's use that example.", "meaning": "He asks readers to follow his chosen shelf-cleaning comparison.", "options": ["He asks readers to follow his chosen shelf-cleaning comparison.", "He abandons the shelf example immediately.", "He gives staff freedom to choose any work task.", "He tells readers the story has ended."], "why": "The short directive controls the discussion by deciding which example the audience should use.", "section": "e02", "page": 1, "paragraph": 1}, {"id": "s007", "text": "If we spend the hour before the shelf cleaning talking down the process of cleaning the shelf, complaining about it, dreading it, investigating the moral niceties of cleaning the shelf, whatever, then what happens is, we make the process of cleaning the shelf more difficult than it really is.", "meaning": "He groups ethical questioning with complaining and claims that all of it makes the job harder.", "options": ["He groups ethical questioning with complaining and claims that all of it makes the job harder.", "He carefully separates moral inquiry from grumbling.", "He asks for a formal ethical review before every job.", "He proves that the work cannot harm anyone."], "why": "The long list places “investigating the moral niceties” beside complaint and dread; “whatever” dismisses the distinctions. His claim about difficulty does not establish moral innocence.", "section": "e03", "page": 1, "paragraph": 1}, {"id": "s008", "text": "We all know very well that that “shelf” is going to be cleaned, given the current climate, either by you or the guy who replaces you and gets your paycheck, so the question boils down to: Do I want to clean it happy or do I want to clean it sad?", "meaning": "Todd treats the task as unavoidable, threatens replacement, and reduces the worker’s choice to attitude.", "options": ["Todd treats the task as unavoidable, threatens replacement, and reduces the worker’s choice to attitude.", "He offers employees a free choice about whether the work should happen.", "He guarantees that refusing the task will protect their pay.", "He says the current climate is a weather forecast."], "why": "The replacement taking the paycheck makes the choice coercive. The happy/sad question excludes the more serious option of challenging the work itself.", "section": "e03", "page": 1, "paragraph": 1}, {"id": "s009", "text": "Which would be more effective?", "meaning": "He steers readers toward judging the two attitudes by efficiency.", "options": ["He steers readers toward judging the two attitudes by efficiency.", "He asks which task is morally justified.", "He asks the audience to choose a new director.", "He announces an objective measurement has already proved his case."], "why": "The question follows the happy/sad alternatives. It pushes efficiency to the foreground while leaving the work’s ethics unexamined.", "section": "e03", "page": 1, "paragraph": 1}, {"id": "s010", "text": "For me?", "meaning": "He narrows the question to the worker’s supposed personal advantage.", "options": ["He narrows the question to the worker’s supposed personal advantage.", "He asks whether Todd should receive a gift.", "He switches to discussing his childhood.", "He admits the staff will not benefit in any way."], "why": "The fragment follows “more effective” and makes the next argument seem concerned with the individual worker’s interests.", "section": "e03", "page": 1, "paragraph": 1}, {"id": "s011", "text": "Which would accomplish my purpose more efficiently?", "meaning": "He asks which attitude would help the worker achieve a goal most efficiently.", "options": ["He asks which attitude would help the worker achieve a goal most efficiently.", "He asks whether the goal itself is morally acceptable.", "He asks how to avoid receiving wages.", "He argues that efficiency never matters."], "why": "The wording directs attention to efficient means. The next question supplies the goal he wants workers to accept.", "section": "e04", "page": 1, "paragraph": 1}, {"id": "s012", "text": "What is my purpose?", "meaning": "He raises a question about the worker’s goal so he can immediately define it.", "options": ["He raises a question about the worker’s goal so he can immediately define it.", "He invites a long, unrestricted discussion of life’s meaning.", "He confesses he has forgotten his job title.", "He says there can be no purpose to work."], "why": "In this sequence the question functions as a set-up, not a genuinely open inquiry: Todd promptly supplies the answer.", "section": "e04", "page": 1, "paragraph": 1}, {"id": "s013", "text": "To get paid.", "meaning": "He reduces the worker’s purpose to receiving wages.", "options": ["He reduces the worker’s purpose to receiving wages.", "He defines the purpose as protecting possible victims.", "He says the work is unpaid volunteer service.", "He identifies the worker’s private beliefs with certainty."], "why": "The terse answer asserts a narrow financial motive. It should be read as Todd’s framing of the staff’s purpose, not an omniscient statement about every worker.", "section": "e04", "page": 1, "paragraph": 1}, {"id": "s014", "text": "How do I accomplish that purpose most efficiently?", "meaning": "He asks how to secure that pay most efficiently.", "options": ["He asks how to secure that pay most efficiently.", "He asks how to investigate the organisation’s morality.", "He asks which island the staff should visit.", "He changes the stated purpose to leisure."], "why": "“That purpose” refers back to getting paid; the question makes efficient performance the route to wages.", "section": "e04", "page": 1, "paragraph": 1}, {"id": "s015", "text": "I clean that shelf well and clean it quickly.", "meaning": "He says good, fast performance is the route to getting paid.", "options": ["He says good, fast performance is the route to getting paid.", "He says slow work is the required goal.", "He says wages depend on reporting abuse.", "He says another person has already finished the task."], "why": "The parallel “well” and “quickly” makes quality and speed the criteria. The first-person voice models the answer he wants employees to repeat.", "section": "e04", "page": 1, "paragraph": 1}, {"id": "s016", "text": "And what mental state helps me clean that shelf well and quickly?", "meaning": "He connects the efficiency he wants to the worker’s attitude.", "options": ["He connects the efficiency he wants to the worker’s attitude.", "He announces a medical diagnosis of every worker.", "He asks what the shelf is made from.", "He says mental state has no relation to performance."], "why": "The question leads from performance to inner attitude, expanding managerial concern from actions to how staff think and feel.", "section": "e04", "page": 1, "paragraph": 1}, {"id": "s017", "text": "Is the answer: Negative?", "meaning": "He offers a negative attitude as an answer he expects readers to reject.", "options": ["He offers a negative attitude as an answer he expects readers to reject.", "He asks for a calculation involving negative integers.", "He sincerely recommends pessimism as the final policy.", "He announces the task has been cancelled."], "why": "The surrounding questions make “Negative?” a leading prompt. He is preparing the audience for his preferred answer.", "section": "e05", "page": 1, "paragraph": 1}, {"id": "s018", "text": "A negative mental state?", "meaning": "He repeats the rejected possibility to emphasise it.", "options": ["He repeats the rejected possibility to emphasise it.", "He introduces a separate medical assessment.", "He changes the topic to a different employee.", "He withdraws his concern about attitude."], "why": "The fragment restates the previous question rather than opening a new subject.", "section": "e05", "page": 1, "paragraph": 1}, {"id": "s019", "text": "You know very well that it is not.", "meaning": "He assumes that the audience agrees a negative attitude is not helpful.", "options": ["He assumes that the audience agrees a negative attitude is not helpful.", "He shows a study proving every possible effect of attitude.", "He asks the audience to disagree openly.", "He admits the answer is still unknown to him."], "why": "The asserted “you know” places pressure on readers to share his conclusion; it does not supply new evidence.", "section": "e05", "page": 1, "paragraph": 1}, {"id": "s020", "text": "So the point of this memo is: Positive.", "meaning": "He compresses the memo’s stated message into a demand for positivity.", "options": ["He compresses the memo’s stated message into a demand for positivity.", "He says the memo is mainly a wage calculation.", "He concludes that employees should freely discuss their doubts.", "He says the memo has no central message."], "why": "The isolated “Positive” sounds like a slogan. Its later connection to threats complicates the apparently encouraging message.", "section": "e05", "page": 1, "paragraph": 1}, {"id": "s021", "text": "The positive mental state will help you clean that shelf well and quickly, thus accomplishing your purpose of getting paid.", "meaning": "He concludes that positivity will improve performance and so serve the pay-related goal he has defined.", "options": ["He concludes that positivity will improve performance and so serve the pay-related goal he has defined.", "He proves the work is morally good because it is paid.", "He promises that ethical objections will increase wages.", "He says quality and speed have become irrelevant."], "why": "The conclusion links attitude, output, and pay. It does not establish that an efficient or paid action is ethically justified.", "section": "e05", "page": 1, "paragraph": 1}, {"id": "s022", "text": "What am I saying?", "meaning": "Todd pauses to restate and explain the message he wants readers to take.", "options": ["Todd pauses to restate and explain the message he wants readers to take.", "He asks the staff to write the memo for him.", "He announces that the previous words were not his.", "He identifies a second narrator."], "why": "The self-question is a transition in his persuasive monologue, not evidence of another speaker.", "section": "e06", "page": 1, "paragraph": 2}, {"id": "s023", "text": "Am I saying whistle while you work?", "meaning": "He considers whether he is telling workers to stay cheerful while doing unpleasant work.", "options": ["He considers whether he is telling workers to stay cheerful while doing unpleasant work.", "He orders every worker to bring a musical instrument.", "He explains that the tasks are easy and enjoyable for everyone.", "He quotes a staff complaint about factory noise."], "why": "The idiom links cheerful behavior with work. It need not mean literal whistling.", "section": "e06", "page": 1, "paragraph": 2}, {"id": "s024", "text": "Maybe I am.", "meaning": "He tentatively accepts that description of his message.", "options": ["He tentatively accepts that description of his message.", "He firmly denies wanting cheerfulness.", "He says the reader must choose a new narrator.", "He admits he has no role in the organisation."], "why": "The short qualification keeps his tone casual while allowing him to continue urging a positive attitude.", "section": "e06", "page": 1, "paragraph": 2}, {"id": "s025", "text": "Let us consider lifting a heavy dead carcass such as a whale.", "meaning": "He proposes another example: a group moving an unpleasant, very heavy dead animal.", "options": ["He proposes another example: a group moving an unpleasant, very heavy dead animal.", "He claims workers in Room 6 are certainly marine biologists.", "He reports that the whale is alive and being rescued.", "He says the shelf example was a scientific experiment."], "why": "The new comparison shifts from mundane cleaning to a physically and emotionally unpleasant task. It still does not identify the actual Room 6 operation.", "section": "e06", "page": 1, "paragraph": 2}, {"id": "s026", "text": "(Forgive the shelf/whale thing, we have just come back from our place on Reston Island, where there were 1) a lot of dirty shelves, and 2) yes, believe it or not, an actual dead rotting whale, which Timmy and Vance and I got involved with in terms of the cleanup.)", "meaning": "He apologetically explains that his recent trip supplied both examples, including a whale cleanup with Timmy and Vance.", "options": ["He apologetically explains that his recent trip supplied both examples, including a whale cleanup with Timmy and Vance.", "He says the whale cleanup is a written policy for the staff.", "He says he never personally encountered a whale.", "He states that Timmy and Vance are named prisoners in Room 6."], "why": "The parenthetical aside gives the analogy a personal, conversational origin. Timmy and Vance are not identified here as people in Room 6.", "section": "e07", "page": 1, "paragraph": 2}, {"id": "s027", "text": "So say you are charged with, you and some of your colleagues, lifting a heavy dead whale carcass onto a flatbed.", "meaning": "He asks staff to imagine being assigned the whale-lifting task as a team.", "options": ["He asks staff to imagine being assigned the whale-lifting task as a team.", "He says the staff have already agreed to buy a truck.", "He orders the reader to punish Timmy and Vance.", "He announces the whale is light enough for one person."], "why": "“Say” again introduces a hypothetical assignment. The reference to colleagues transfers his holiday story into a workplace comparison.", "section": "e07", "page": 1, "paragraph": 2}, {"id": "s028", "text": "Now we all know that is hard.", "meaning": "He treats the difficulty of lifting a whale as obvious shared knowledge.", "options": ["He treats the difficulty of lifting a whale as obvious shared knowledge.", "He concludes that the work should never be attempted.", "He says ethical judgment is easy.", "He claims the animal is not heavy."], "why": "“That” refers to the imagined physical task; the sentence recruits audience agreement before he discusses attitude.", "section": "e07", "page": 1, "paragraph": 2}, {"id": "s029", "text": "And what would be harder is: doing that with a negative attitude.", "meaning": "He asserts that negativity would add to the task’s difficulty.", "options": ["He asserts that negativity would add to the task’s difficulty.", "He says negativity would make the whale lighter.", "He proves that equipment cannot affect the result.", "He claims the team did not need cooperation."], "why": "The sentence asserts the role of attitude but does not exclude other relevant factors such as technique, equipment, or coordination.", "section": "e07", "page": 1, "paragraph": 2}, {"id": "s030", "text": "What we found—Timmy and Vance and I—is that even with only a neutral attitude, you are talking a very hard task.", "meaning": "Todd says that even neutrality did not make the whale task manageable for them.", "options": ["Todd says that even neutrality did not make the whale task manageable for them.", "He says neutral means openly refusing the work.", "He proves neutrality is morally worse than violence.", "He says the whale was imaginary."], "why": "He broadens his target from negativity to neutrality: the attitude he wants is actively positive, not merely unopposed.", "section": "e08", "page": 1, "paragraph": 2}, {"id": "s031", "text": "We tried to lift that whale while we were just feeling neutral, Timmy and Vance and I, with a dozen or so other folks, and it was a no-go, that whale wouldn't budge, until suddenly one fellow, a former Marine, said that what we needed was some mind over matter, and gathered us in a little circle, and we had a sort of chant.", "meaning": "The initial attempt failed; a former Marine then organised a motivational chant.", "options": ["The initial attempt failed; a former Marine then organised a motivational chant.", "The group moved the whale before the Marine arrived.", "Nobody besides the three family members was present.", "The sentence says the whale literally answered their chant."], "why": "The long accumulating sentence shifts from failure to collective excitement. The sequence alone does not isolate motivation as the only cause of later success.", "section": "e08", "page": 1, "paragraph": 2}, {"id": "s032", "text": "We got “psyched up.”", "meaning": "The group became excited and mentally ready for effort.", "options": ["The group became excited and mentally ready for effort.", "The group underwent a formal psychiatric diagnosis.", "The whale became frightened of the group.", "The team decided to abandon the cleanup."], "why": "The colloquial phrase means energised or motivated, not clinically diagnosed.", "section": "e08", "page": 1, "paragraph": 2}, {"id": "s033", "text": "We knew, to extend my above analogy, that we had a job to do, and got sort of excited about that, and decided to do it with a positive attitude.", "meaning": "He presents the group’s new enthusiasm as a model for the staff’s response to assigned work.", "options": ["He presents the group’s new enthusiasm as a model for the staff’s response to assigned work.", "He withdraws the comparison between the trip and the workplace.", "He admits nobody knew what task to perform.", "He says enthusiasm permits staff to select which laws apply."], "why": "“Extend my above analogy” explicitly marks the comparison. Readers can assess its limits rather than simply accept it.", "section": "e08", "page": 1, "paragraph": 2}, {"id": "s034", "text": "and I have to tell you, there was something to that, it was fun, fun when that whale rose into the air, helped by us and some big straps that Marine had in his van, and I have to say that lifting that dead rotting whale onto that flatbed with that group of total strangers was the high point of our trip.", "meaning": "He celebrates the successful lift as a joyful shared experience while also mentioning the straps that helped make it possible.", "options": ["He celebrates the successful lift as a joyful shared experience while also mentioning the straps that helped make it possible.", "He states that positive thought alone lifted the whale without physical assistance.", "He says he already knew all the other volunteers.", "He describes the whale as alive and healthy."], "why": "The page continues the preceding paragraph with a lowercase “and.” “Fun, fun” stresses excitement; the straps reveal practical assistance that complicates the simple attitude-causes-success story.", "section": "e09", "page": 2, "paragraph": 2}, {"id": "s035", "text": "So what am I saying?", "meaning": "Todd returns from the anecdote to the memo’s intended lesson.", "options": ["Todd returns from the anecdote to the memo’s intended lesson.", "He says the whale story has no relation to his argument.", "He asks a second author to take over.", "He ends all attempts at persuasion."], "why": "The repeated self-question is a structural pivot back to his instructions for employees.", "section": "e10", "page": 2, "paragraph": 3}, {"id": "s036", "text": "I am saying (and saying it fervently, because it is important): Let’s try, if we can, to minimize the grumbling and self-doubt regarding the tasks we must sometimes do around here that maybe aren’t on the surface all that pleasant.", "meaning": "He urgently asks employees to reduce complaint and doubt about unpleasant workplace tasks.", "options": ["He urgently asks employees to reduce complaint and doubt about unpleasant workplace tasks.", "He invites staff to publish all their doubts without restriction.", "He guarantees that the tasks are harmless underneath their appearance.", "He proposes ending the work immediately."], "why": "Hedging phrases soften the instruction, but “fervently” signals urgency. His description of unpleasantness does not establish innocence.", "section": "e10", "page": 2, "paragraph": 3}, {"id": "s037", "text": "I'm saying let's try not to dissect every single thing we do in terms of ultimate good/bad/indifferent in terms of morals.", "meaning": "He asks workers to stop closely examining the moral character of what they do.", "options": ["He asks workers to stop closely examining the moral character of what they do.", "He requests more detailed ethical analysis.", "He restricts only the literal dissection of animals.", "He offers a scientific definition of good and bad."], "why": "“Dissect” figuratively means analyse closely. The explicit reference to morals makes suppression of ethical inquiry clear.", "section": "e10", "page": 2, "paragraph": 3}, {"id": "s038", "text": "The time for that is long past.", "meaning": "He declares that moral questioning is no longer appropriate or timely.", "options": ["He declares that moral questioning is no longer appropriate or timely.", "He announces a future meeting for ethical debate.", "He admits earlier decisions can no longer affect anyone.", "He proves that the work has become morally acceptable."], "why": "“That” refers to the moral analysis he has just discouraged. A claim that debate is over does not answer its ethical questions.", "section": "e10", "page": 2, "paragraph": 3}, {"id": "s039", "text": "I hope that each of us had that conversation with ourselves nearly a year ago, when this whole thing started.", "meaning": "He assumes everyone should already have settled their moral doubts at the beginning.", "options": ["He assumes everyone should already have settled their moral doubts at the beginning.", "He says a recorded group vote approved each later action.", "He says no employee has ever questioned the work.", "He gives an exact date for the organisation’s founding."], "why": "“I hope” expresses an expectation, not verified knowledge. The conversation is imagined as private and already completed.", "section": "e11", "page": 2, "paragraph": 3}, {"id": "s040", "text": "We have embarked on a path, and having embarked on that path, for the best of reasons (as we decided a year ago), wouldn’t it be kind of suicidal to let our progress down that path be impeded by neurotic second-guessing?", "meaning": "He frames continued commitment as necessary and portrays renewed doubt as dangerously self-destructive.", "options": ["He frames continued commitment as necessary and portrays renewed doubt as dangerously self-destructive.", "He asks for directions on a literal walking trail.", "He proves that the initial reasons were objectively good.", "He promises that reconsidering the work will be rewarded."], "why": "The path is a metaphor for their shared course of action. “Suicidal” and “neurotic” stigmatise reconsideration; they are Todd’s framing rather than clinical findings.", "section": "e11", "page": 2, "paragraph": 3}, {"id": "s041", "text": "Have any of you ever swung a sledgehammer?", "meaning": "He introduces a familiar physical action as another persuasive comparison.", "options": ["He introduces a familiar physical action as another persuasive comparison.", "He confirms that all tasks in Room 6 use a sledgehammer.", "He announces a construction-training examination.", "He asks which employee owns the office building."], "why": "The question leads into the patio anecdote. It is not a factual description of Room 6 equipment.", "section": "e11", "page": 2, "paragraph": 3}, {"id": "s042", "text": "I know that some of you have.", "meaning": "He claims shared experience with his audience.", "options": ["He claims shared experience with his audience.", "He says no one has used a sledgehammer.", "He admits he does not know any employees.", "He says all staff are construction workers."], "why": "The assertion builds common ground, but “some” does not mean every employee or determine anyone’s occupation.", "section": "e11", "page": 2, "paragraph": 3}, {"id": "s043", "text": "I know that some of you did when we took out Rick’s patio.", "meaning": "He refers to a shared patio-demolition experience to support the comparison.", "options": ["He refers to a shared patio-demolition experience to support the comparison.", "He says the patio is inside Room 6.", "He announces Rick has replaced Andy.", "He says the patio was built rather than removed."], "why": "The shared memory makes the physical example more familiar. The sentence says “took out,” meaning removed in this context.", "section": "e11", "page": 2, "paragraph": 3}, {"id": "s044", "text": "Isn’t it fun when you don’t hold back, but just pound down and down, letting gravity help you?", "meaning": "He presents unrestrained hammering as pleasurable and natural.", "options": ["He presents unrestrained hammering as pleasurable and natural.", "He warns that force must always be limited by moral discussion.", "He proves gravity decides whether an action is right.", "He says nobody has enjoyed physical work."], "why": "The leading question and repeated “down” invite readers to share the pleasure of force; physical gravity does not provide ethical judgment.", "section": "e12", "page": 2, "paragraph": 3}, {"id": "s045", "text": "Fellows, what I’m saying is, let gravity help you here, in our workplace situation: Pound down, give in to the natural feelings that I have seen from time to time produce so much great energy in so many of you, in terms of executing your given tasks with vigor and without second-guessing and neurotic thoughts.", "meaning": "He transfers the hammering example to the workplace, urging vigorous action without reflective doubt.", "options": ["He transfers the hammering example to the workplace, urging vigorous action without reflective doubt.", "He asks employees to calculate gravity before every task.", "He recommends stopping work whenever they feel uncertain.", "He says natural feelings guarantee that the work is harmless."], "why": "The imperatives “Pound down” and “give in” turn the analogy into a directive. “Natural” makes force sound self-justifying while doubt is disparaged.", "section": "e12", "page": 2, "paragraph": 3}, {"id": "s046", "text": "Remember that record-breaking week Andy had back in October, when he doubled his usual number of units?", "meaning": "He uses Andy’s exceptional output as an example others should admire.", "options": ["He uses Andy’s exceptional output as an example others should admire.", "He reports that Andy’s pay was doubled.", "He identifies exactly what each unit physically consists of.", "He says Andy has never exceeded his ordinary output."], "why": "The doubled “units” are a productivity measure. Their concrete referent is withheld, so the reader should not invent an exact tally of a named harm.", "section": "e12", "page": 2, "paragraph": 3}, {"id": "s047", "text": "Regardless of all else, forgetting for the moment all namby-pamby thoughts of right/wrong etc., etc., wasn’t that something to see?", "meaning": "He asks the audience to admire Andy’s output while dismissing moral concerns as weak or fussy.", "options": ["He asks the audience to admire Andy’s output while dismissing moral concerns as weak or fussy.", "He makes right and wrong the main test of Andy’s achievement.", "He asks staff to calculate Andy’s exact wage.", "He admits the output figures do not exist."], "why": "“Namby-pamby” belittles ethical thought; “regardless of all else” instructs readers to isolate performance from consequences.", "section": "e13", "page": 2, "paragraph": 3}, {"id": "s048", "text": "In and of itself?", "meaning": "He asks readers to judge the output separately from its context and consequences.", "options": ["He asks readers to judge the output separately from its context and consequences.", "He asks Andy to work alone in a different building.", "He says no achievement can be judged separately.", "He introduces an unrelated new narrator."], "why": "The fragment continues the preceding question and narrows attention to achievement considered on its own.", "section": "e13", "page": 2, "paragraph": 3}, {"id": "s049", "text": "I think that, if we each look deep down inside of ourselves, weren’t we all a little envious?", "meaning": "He suggests everyone secretly envied Andy’s performance.", "options": ["He suggests everyone secretly envied Andy’s performance.", "He supplies direct access to every worker’s private mind.", "He says nobody admired Andy.", "He confirms that each employee publicly confessed envy."], "why": "“I think” and the leading “weren’t we all” make this a claim about others’ feelings, not reliable omniscient evidence.", "section": "e13", "page": 2, "paragraph": 3}, {"id": "s050", "text": "God, he was really pounding down and you could see the energetic joy on his face each time he rushed by us to get additional cleanup towels.", "meaning": "Todd portrays Andy’s forceful work and repeated trips for towels as visible enthusiasm.", "options": ["Todd portrays Andy’s forceful work and repeated trips for towels as visible enthusiasm.", "The narrator independently confirms that Andy felt morally at peace.", "Andy is described as refusing to work that week.", "The sentence states that the towels were used for harmless household dusting."], "why": "Todd interprets Andy’s expression as joy. The physical details become disturbing in the story’s wider context without specifying exactly what the towels cleaned.", "section": "e13", "page": 2, "paragraph": 3}, {"id": "s051", "text": "And we were all just standing there like, Wow, Andy, what’s gotten into you?", "meaning": "He represents the group as surprised by Andy’s unusually intense performance.", "options": ["He represents the group as surprised by Andy’s unusually intense performance.", "He records a formal disciplinary hearing.", "He says everyone immediately understood Andy’s motives.", "He proves that Andy had physically changed into another person."], "why": "The informal “like, Wow” recreates an impressed group reaction. “What’s gotten into you?” is an expression of surprise, not a literal transformation.", "section": "e14", "page": 2, "paragraph": 3}, {"id": "s052", "text": "And no one can argue with his numbers.", "meaning": "He presents the output figures as unquestionable evidence of success.", "options": ["He presents the output figures as unquestionable evidence of success.", "He proves that high output settles every moral question.", "He says the figures are secret and unavailable.", "He invites staff to reject numerical targets entirely."], "why": "Measurable output can establish quantity, but it does not establish that the measured actions are good. The claim is part of his managerial value system.", "section": "e14", "page": 2, "paragraph": 3}, {"id": "s053", "text": "They are there in our Break Room for all to see, towering above the rest of our numbers, and though Andy has failed to duplicate those numbers in the months since October, 1) no one blames him for that, those were miraculous numbers, and 2) I believe that even if Andy never again duplicates those numbers, he must still, somewhere in his heart, secretly treasure the memory of that magnificent energy flowing out of him that memorable October.", "meaning": "He publicly ranks Andy’s past output, excuses his later decline, and assumes Andy must treasure the achievement.", "options": ["He publicly ranks Andy’s past output, excuses his later decline, and assumes Andy must treasure the achievement.", "He reports that Andy himself says he treasures October.", "He says Andy has matched his record every month.", "He says the Break Room figures are private."], "why": "The long sentence combines public comparison with an unsupported claim about Andy’s inner feelings. “Towering” and “miraculous” magnify the achievement.", "section": "e14", "page": 2, "paragraph": 3}, {"id": "s054", "text": "I do not honestly think Andy could’ve had such an October if he had been coddling himself or entertaining any doubtful neurotic thoughts or second-guessing tendencies, do you?", "meaning": "He attributes Andy’s peak output to the absence of self-protective doubt and presses the audience to agree.", "options": ["He attributes Andy’s peak output to the absence of self-protective doubt and presses the audience to agree.", "He confirms a clinician has diagnosed Andy.", "He recommends that Andy spend more time reflecting on the work.", "He admits he has no view about the cause of the record."], "why": "The leading tag question recruits agreement. Todd’s pejorative descriptions are his explanation, not an established diagnosis or a proven causal account.", "section": "e15", "page": 2, "paragraph": 3}, {"id": "s055", "text": "I don’t.", "meaning": "He supplies his own negative answer to the question he has just posed.", "options": ["He supplies his own negative answer to the question he has just posed.", "He denies that Andy ever worked in October.", "He says he does not know Andy’s name.", "He says staff may freely reject his argument."], "why": "The fragment demonstrates once again that his apparent dialogue includes answers he gives himself.", "section": "e15", "page": 2, "paragraph": 3}, {"id": "s056", "text": "Andy looked totally focused, totally outside himself, you could see it on his face, maybe because of the new baby?", "meaning": "He speculates that the new baby may explain Andy’s unusually intense, self-forgetting focus.", "options": ["He speculates that the new baby may explain Andy’s unusually intense, self-forgetting focus.", "He establishes the baby as the proven cause of the record.", "He reports that Andy was looking after the baby in Room 6.", "He says Andy looked relaxed and disengaged."], "why": "“Looked” and “maybe” mark perception and speculation. The text does not establish the exact emotional effect of the baby on Andy.", "section": "e15", "page": 2, "paragraph": 3}, {"id": "s057", "text": "(If so, Janice should have a new baby every week, ha ha.)", "meaning": "He makes an intrusive joke that treats repeated childbirth as a way to sustain output.", "options": ["He makes an intrusive joke that treats repeated childbirth as a way to sustain output.", "He gives a medically possible weekly birth schedule.", "He tells us Janice has agreed to this plan.", "He sincerely announces a workplace childcare policy."], "why": "The implausible exaggeration and “ha ha” dress an intrusive, productivity-centred comment as humour.", "section": "e15", "page": 2, "paragraph": 3}, {"id": "s058", "text": "Anyway, October is how Andy entered a sort of, at least in my mind, de facto Hall of Fame, and is pretty much henceforth excluded from any real close monitoring of his numbers, at least by me.", "meaning": "Todd says Andy’s achievement earned him unofficial special status and, supposedly, less scrutiny from Todd.", "options": ["Todd says Andy’s achievement earned him unofficial special status and, supposedly, less scrutiny from Todd.", "He says Andy received a documented award from an official hall.", "He guarantees that no one in the organisation can monitor Andy.", "He says Andy’s record has been erased."], "why": "“De facto,” “in my mind,” and “at least by me” qualify the claim. Todd does not promise organisation-wide immunity.", "section": "e16", "page": 3, "paragraph": 4}, {"id": "s059", "text": "No matter how disconsolate and sort of withdrawn he gets (and I think we’ve all noticed that he’s gotten pretty disconsolate and withdrawn since October), you will not find me closely monitoring his numbers, although as for others I cannot speak, others may be monitoring that troubling falloff in Andy’s numbers, although really I hope they’re not, that would not be so fair, and believe me, if I get wind of it, I will definitely let Andy know, and if Andy’s too depressed to hear me, I’ll call Janice at home.", "meaning": "He insists he is not scrutinising Andy while describing Andy’s distress, declining output, possible surveillance, and contact with his home.", "options": ["He insists he is not scrutinising Andy while describing Andy’s distress, declining output, possible surveillance, and contact with his home.", "He confirms that Andy feels cheerful and socially engaged.", "He guarantees that every other supervisor has stopped watching Andy.", "He says family life is entirely outside managerial attention."], "why": "The accumulating qualifications undermine the reassurance: he appears highly aware of the decline and extends attention into the home. This creates irony without proving he personally conducts every act of monitoring.", "section": "e16", "page": 3, "paragraph": 4}, {"id": "s060", "text": "And in terms of why is Andy so disconsolate?", "meaning": "Todd introduces a question about the reason for Andy’s unhappiness.", "options": ["Todd introduces a question about the reason for Andy’s unhappiness.", "He announces a confirmed medical explanation.", "He asks why Andy is outperforming everyone this month.", "He says Andy has never appeared unhappy."], "why": "The question opens Todd’s explanation of a distress already described. It does not itself establish its cause.", "section": "e17", "page": 3, "paragraph": 5}, {"id": "s061", "text": "My guess is that he’s being neurotic, and second-guessing his actions of October—and wow, wouldn’t that be a shame, wouldn’t that be a no-win, for Andy to have completed that record-breaking October and then sit around boo-hooing about it?", "meaning": "He speculates that Andy regrets October and mocks that possible remorse as pointless weakness.", "options": ["He speculates that Andy regrets October and mocks that possible remorse as pointless weakness.", "He reports Andy’s verified confession about exactly what happened.", "He treats remorse as a serious ethical judgment deserving discussion.", "He claims Andy’s October output never occurred."], "why": "“My guess” signals uncertainty; “neurotic” and “boo-hooing” disparage distress. Readers may infer guilt or trauma, but should not turn Todd’s guess into a clinical finding.", "section": "e17", "page": 3, "paragraph": 5}, {"id": "s062", "text": "Is anything being changed by that boo-hooing?", "meaning": "He challenges the practical value of Andy’s distress.", "options": ["He challenges the practical value of Andy’s distress.", "He proves that reflection can never affect future choices.", "He asks whether Andy’s tears alter the weather.", "He announces the organisation has changed its policy."], "why": "The rhetorical question argues from inability to undo the past. It does not establish that remorse or reflection has no future value.", "section": "e17", "page": 3, "paragraph": 5}, {"id": "s063", "text": "Are the actions Andy did, in terms of the tasks I gave him to do in Room 6, being undone by his boo-hooing, are his numbers on the Break Room wall miraculously scrolling downward, are people suddenly walking out of Room 6 feeling perfectly okay again?", "meaning": "He says distress cannot reverse assigned actions or their effects, revealing that people in Room 6 have been harmed.", "options": ["He says distress cannot reverse assigned actions or their effects, revealing that people in Room 6 have been harmed.", "He says people routinely leave Room 6 entirely unharmed.", "He confirms that all harmed people have recovered.", "He gives a complete account of the exact acts performed in Room 6."], "why": "The linked questions connect output to people who are not “okay.” Serious harm is strongly implied, while the precise operation remains unnamed.", "section": "e17", "page": 3, "paragraph": 5}, {"id": "s064", "text": "Well we all know they are not.", "meaning": "Todd assumes agreement that the harm cannot simply be reversed.", "options": ["Todd assumes agreement that the harm cannot simply be reversed.", "He says all victims are fully recovered.", "He confirms workers are free to end every task.", "He introduces evidence that nobody has been harmed."], "why": "The pronoun points back to the preceding negative rhetorical questions. His assumed consensus closes off discussion rather than investigating it.", "section": "e18", "page": 3, "paragraph": 5}, {"id": "s065", "text": "No one is walking out of Room 6 feeling perfectly okay.", "meaning": "He acknowledges that leaving Room 6 does not leave people well.", "options": ["He acknowledges that leaving Room 6 does not leave people well.", "He guarantees Room 6 is a harmless recreation area.", "He identifies exactly which injury each person has.", "He says nobody has ever entered Room 6."], "why": "The sentence explicitly denies well-being, but it does not name every person, injury, or method involved.", "section": "e18", "page": 3, "paragraph": 5}, {"id": "s066", "text": "Even you guys, you who do what must be done in Room 6, don’t walk out feeling so super-great, I know that, I’ve certainly done some things in Room 6 that didn’t leave me feeling so wonderful, believe me, no one is trying to deny that Room 6 can be a bummer, it is very hard work that we do.", "meaning": "He acknowledges distress among the workers and himself while minimising it as an unpleasant feature of necessary work.", "options": ["He acknowledges distress among the workers and himself while minimising it as an unpleasant feature of necessary work.", "He clearly describes every worker as a willing, happy participant.", "He states that he has never personally worked in Room 6.", "He names the exact organisation that runs Room 6."], "why": "“Even you guys” distinguishes operators’ distress from others’ suffering. “Bummer” and “hard work” soften what may be deeply damaging.", "section": "e18", "page": 3, "paragraph": 5}, {"id": "s067", "text": "But the people above us, who give us our assignments, seem to think that the work we do in Room 6, in addition to being hard, is also important, which I suspect is why they have begun watching our numbers so closely.", "meaning": "He appeals to higher authority and speculates that its belief in the work’s importance explains closer monitoring.", "options": ["He appeals to higher authority and speculates that its belief in the work’s importance explains closer monitoring.", "He proves that higher authority has made the work ethical.", "He says senior managers have stopped checking output.", "He says staff independently choose all their assignments."], "why": "“Seem to think” and “I suspect” mark uncertainty. Authority’s approval and surveillance are not themselves a moral justification.", "section": "e19", "page": 3, "paragraph": 5}, {"id": "s068", "text": "And trust me, if you want Room 6 to be an even worse bummer than it already is, then mope about it before, after, and during, then it will really stink, plus, with all the moping, your numbers will go down even further, which guess what: they cannot do.", "meaning": "He warns that persistent unhappiness will worsen the experience and lower output that management will not allow to fall.", "options": ["He warns that persistent unhappiness will worsen the experience and lower output that management will not allow to fall.", "He says employees are welcome to reduce their output.", "He announces a policy of caring for staff regardless of productivity.", "He proves that every decline is caused solely by moping."], "why": "The sequence ties feelings to forbidden decline. “Cannot” here expresses a managerial prohibition, not a physical impossibility.", "section": "e19", "page": 3, "paragraph": 5}, {"id": "s069", "text": "I have been told in no uncertain terms, at the Sectional Meeting, that our numbers are not to go down any further.", "meaning": "He reports an emphatic instruction from above to prevent any further reduction in output.", "options": ["He reports an emphatic instruction from above to prevent any further reduction in output.", "He says the targets are optional suggestions.", "He says the meeting cancelled numerical monitoring.", "He admits no superior has discussed output with him."], "why": "“In no uncertain terms” means unmistakably or firmly. The passive phrasing highlights pressure passed down the hierarchy.", "section": "e19", "page": 3, "paragraph": 5}, {"id": "s070", "text": "I said (and this took guts, believe me, given the atmosphere at Sectional): look, my guys are tired, this is hard work we do, both physically and psychologically.", "meaning": "He presents himself as bravely telling senior managers that the staff are physically and mentally exhausted.", "options": ["He presents himself as bravely telling senior managers that the staff are physically and mentally exhausted.", "He reports that the staff have no psychological burden.", "He says the senior managers praised his objection.", "He confirms another witness agrees with his account of his courage."], "why": "The claim of bravery belongs to Todd’s self-presentation. His description acknowledges fatigue but offers no independent witness to his role.", "section": "e20", "page": 3, "paragraph": 5}, {"id": "s071", "text": "And at that point, at Sectional, believe me, the silence was deafening.", "meaning": "He describes an intense, intimidating lack of response at the meeting.", "options": ["He describes an intense, intimidating lack of response at the meeting.", "He says an actual loudspeaker caused hearing damage.", "He says everyone answered warmly at once.", "He says nobody attended the meeting."], "why": "The apparent contradiction makes silence feel oppressive. It describes emotional intensity, not literal sound volume.", "section": "e20", "page": 3, "paragraph": 5}, {"id": "s072", "text": "And I mean deafening.", "meaning": "He repeats the word to intensify his account of that threatening silence.", "options": ["He repeats the word to intensify his account of that threatening silence.", "He supplies an audiometer reading.", "He retracts the previous description.", "He says the silence was ordinary and unremarkable."], "why": "The emphatic repetition makes his claimed pressure more vivid without adding objective measurement.", "section": "e20", "page": 3, "paragraph": 5}, {"id": "s073", "text": "And the looks I got were not good.", "meaning": "He says other people’s expressions signalled disapproval or hostility.", "options": ["He says other people’s expressions signalled disapproval or hostility.", "He says the room’s decoration was unattractive.", "He says colleagues visibly welcomed his concerns.", "He proves the exact private thoughts of every person present."], "why": "“Looks” refers to expressions directed at him. He interprets them negatively, but the sentence does not reveal every person’s mind.", "section": "e20", "page": 3, "paragraph": 5}, {"id": "s074", "text": "And I was reminded, in no uncertain terms, by Hugh Blanchert himself, that our numbers are not to go down.", "meaning": "He says a named senior figure personally reinforced the no-decline demand.", "options": ["He says a named senior figure personally reinforced the no-decline demand.", "He says Hugh gave permission to stop working.", "He says the output target was abolished.", "He says he never met a superior at the meeting."], "why": "“Himself” stresses the authority of the named person; the repeated formula underscores the pressure to maintain output.", "section": "e20", "page": 3, "paragraph": 5}, {"id": "s075", "text": "And I was asked to remind you—to remind us, all of us, myself included—that if we are unable to clean our assigned “shelf,” not only will someone else be brought in to clean that “shelf,” but we ourselves may find ourselves on that “shelf,” being that “shelf,” with someone else exerting themselves with good positive energy all over us.", "meaning": "He warns that workers who fail may be replaced and themselves subjected to the treatment they currently administer.", "options": ["He warns that workers who fail may be replaced and themselves subjected to the treatment they currently administer.", "He offers a harmless rotation of ordinary cleaning duties.", "He guarantees that Todd is exempt from every threat.", "He promises that workers can safely opt out of Room 6."], "why": "The people doing the “cleaning” may become the “shelf.” The analogy turns into a threat, strongly implying victimisation rather than a mere change of chore.", "section": "e21", "page": 3, "paragraph": 5}, {"id": "s076", "text": "And at that time I think you can imagine how regretful you would feel, the regret you would show in your faces, as we sometimes witness, in Room 6, that regret on the faces of the “shelves” as they are “cleaned.”", "meaning": "He asks staff to imagine suffering as the people treated in Room 6 already do.", "options": ["He asks staff to imagine suffering as the people treated in Room 6 already do.", "He says actual furniture has human faces.", "He says regret is impossible for anyone in Room 6.", "He gives an exact clinical account of each person’s distress."], "why": "This sentence crosses the photo 3–4 page break. The “faces” expose the human referent hidden by the object word, while the exact treatment remains euphemised.", "section": "e21", "page": 3, "paragraph": 5}, {"id": "s077", "text": "so I am asking you, from the hip, to try your best and not end up a “shelf,” which we, your former colleagues, will have no choice but to clean clean clean using all our positive energy, without looking back, in Room 6.", "meaning": "He urges compliance by warning that former colleagues would administer the same harmful treatment to a worker who becomes a target.", "options": ["He urges compliance by warning that former colleagues would administer the same harmful treatment to a worker who becomes a target.", "He promises colleagues will refuse any order that harms a worker.", "He says positive energy now guarantees protection from coercion.", "He invites workers to decide freely which orders are ethical."], "why": "The lowercase “so” continues the printed paragraph after a full stop. Repeated “clean” and “no choice” make the appeal coercive, not simply supportive.", "section": "e22", "page": 4, "paragraph": 5}, {"id": "s078", "text": "This was all made clear to me at Sectional and now I am trying to make it clear to you.", "meaning": "He presents himself as passing down the warning he received from higher authority.", "options": ["He presents himself as passing down the warning he received from higher authority.", "He says the staff invented the warning themselves.", "He denies that he has attended a meeting.", "He says no employee needs to follow the message."], "why": "The sentence makes the managerial chain explicit: pressure received by Todd is relayed to those below him.", "section": "e22", "page": 4, "paragraph": 6}, {"id": "s079", "text": "Well I have gone on and on, but please come by my office, anybody who’s having doubts, doubts about what we do, and I will show you pictures of that incredible whale my sons and I lifted with our good positive energy.", "meaning": "He invites doubters into his office and offers the whale story again as reassurance.", "options": ["He invites doubters into his office and offers the whale story again as reassurance.", "He offers to show photographic proof of the exact events in Room 6.", "He says employees may anonymously change the organisation’s policy.", "He says he has abandoned the positivity message."], "why": "The whale is reintroduced as a reassuring analogy. In the context of earlier threats, an invitation that identifies doubters can also feel like surveillance.", "section": "e23", "page": 4, "paragraph": 7}, {"id": "s080", "text": "And of course this information, that is, the information that you are having doubts, and have come to see me in my office, will go no further than my office, although I am sure I do not even have to say that, to any of you, who have known me all these many years.", "meaning": "He promises confidentiality about employees’ doubts and invokes personal trust, but the context makes the assurance questionable.", "options": ["He promises confidentiality about employees’ doubts and invokes personal trust, but the context makes the assurance questionable.", "He announces that all doubts have already been posted in the Break Room.", "He proves that confidentiality will definitely be honoured.", "He guarantees that no one in authority is interested in dissent."], "why": "The sentence explicitly defines the sensitive information as the fact of having doubts. The promise should be assessed against the threatening hierarchy, not accepted or rejected as a proven future event.", "section": "e23", "page": 4, "paragraph": 7}, {"id": "s081", "text": "All will be well and all will be well, etc., etc.,", "meaning": "He closes with repeated reassurance that sounds mechanical and dismissive after the threats.", "options": ["He closes with repeated reassurance that sounds mechanical and dismissive after the threats.", "He proves that nobody will be hurt in the future.", "He admits the company has shut down permanently.", "He gives a complete practical plan to protect staff."], "why": "“Etc., etc.” trails off rather than developing care or protection. The threat-filled context makes the soothing words sound hollow. The printed closing uses a comma rather than an ordinary final full stop.", "section": "e24", "page": 4, "paragraph": 8}], "questions": [{"id": "m-s001", "section": "e01", "skill": "Close reading", "prompt": "What does Todd’s opening qualification reveal about his managerial authority?", "options": ["His formal manner establishes distance from the emotional concerns of staff.", "His confident manner conceals anxiety about whether the staff will comply.", "His hesitant manner signals willingness to let the staff reject his request.", "His apologetic manner accepts responsibility for the staff’s worsening working conditions."], "why": "“Although” weakens his denial of pleading. His authority needs persuasion, even as he tries to sound confident; he does not invite rejection or accept responsibility here.", "hint": "Compare Todd’s denial with his qualification and the tone of his paycheck joke.", "evidence": ["s001"], "sentenceId": "s001", "answer": 1, "reasons": ["This choice is not supported by the target wording. “Although” weakens his denial of pleading. His authority needs persuasion, even as he tries to sound confident; he does not invite rejection or accept responsibility here.", "“Although” weakens his denial of pleading. His authority needs persuasion, even as he tries to sound confident; he does not invite rejection or accept responsibility here.", "This choice is not supported by the target wording. “Although” weakens his denial of pleading. His authority needs persuasion, even as he tries to sound confident; he does not invite rejection or accept responsibility here.", "This choice is not supported by the target wording. “Although” weakens his denial of pleading. His authority needs persuasion, even as he tries to sound confident; he does not invite rejection or accept responsibility here."]}, {"id": "m-s002", "section": "e01", "skill": "Close reading", "prompt": "How does the paycheck aside help Todd secure the staff’s cooperation?", "options": const order=D.sections.flatMap(s=>s.questionIds);let selection=null,eliminated=new Set(),hintOpen=false,sourcePage=1,dialogType='',saveOK=true;
function fresh(){return {version:1,current:order[0],section:D.sections[0].id,filter:'all',size:18,dark:false,answers:{},hints:{}}}
function clean(x){const out=fresh();if(!x||x.version!==1)return out;out.current=byQ[x.current]?x.current:out.current;out.section=byE[x.section]?x.section:byQ[out.current].section;out.filter=['all','meaning','devices','missed'].includes(x.filter)?x.filter:'all';out.size=[16,18,20,22].includes(x.size)?x.size:18;out.dark=x.dark===true;for(const [id,v]of Object.entries(x.hints||{}))if(byQ[id]&&v===true)out.hints[id]=true;for(const [id,a]of Object.entries(x.answers||{})){const q=byQ[id];if(!q||!a||!Number.isInteger(a.firstChoice)||a.firstChoice<0||a.firstChoice>=q.options.length)continue;const choice=Number.isInteger(a.choice)&&a.choice>=0&&a.choice<q.options.length?a.choice:a.firstChoice;out.answers[id]={firstChoice:a.firstChoice,firstAssisted:!!a.firstAssisted,choice,checked:a.checked!==false,attempts:Math.max(1,Math.min(100,Number.isInteger(a.attempts)?a.attempts:1)),hintUsed:!!a.hintUsed,firstAt:typeof a.firstAt==='string'?a.firstAt.slice(0,30):'',lastCorrect:choice===q.answer};}return out;}
let state;try{state=clean(JSON.parse(localStorage.getItem(KEY)))}catch{state=fresh();saveOK=false;}
const $=s=>document.querySelector(s),progress=id=>state.answers[id],answered=id=>!!progress(id),correct=id=>progress(id)?.firstChoice===byQ[id].answer;
