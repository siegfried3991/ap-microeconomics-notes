function included(q){return state.filter==='all'||state.filter==='meaning'&&q.skill==='Close reading'||state.filter==='devices'&&q.skill!=='Close reading'||state.filter==='missed'&&progress(q.id)?.lastCorrect===false;}
function list(section=state.section){return byE[section].questionIds.filter(id=>included(byQ[id])||(state.filter==='missed'&&id===state.current&&progress(id)?.checked));}
function jump(id,focus=true){if(!byQ[id])return;state.current=id;state.section=byQ[id].section;selection=progress(id)?.checked?progress(id).choice:null;eliminated=new Set();hintOpen=false;save();render(focus);}
function chooseSection(id){if(!byE[id])return;state.section=id;const ids=list(id);state.current=ids[0]||null;selection=state.current&&progress(state.current)?.checked?progress(state.current).choice:null;eliminated=new Set();hintOpen=false;save();render();}
function btn(text,act,cl='secondary',extra=''){return `<button type="button" class="btn ${cl}" data-act="${act}" ${extra}>${text}</button>`;}
function reading(q){const e=byE[state.section],ids=e.sentenceIds,targets=new Set(q?.evidence||[]);return `<section class="reading" aria-label="Reading excerpt"><header class="pane-heading"><div><h2>${esc(e.title)}</h2><small>Excerpt ${D.sections.indexOf(e)+1} of ${D.sections.length} · source page ${e.page} · original paragraph ${e.paragraph}</small></div></header>${e.id==='e01'?`<div class="memo-header">${esc(D.meta.header)}</div>`:''}<div class="excerpt" style="font-size:${state.size}px">${ids.map(id=>{const s=byS[id];return `<button type="button" class="sentence ${targets.has(id)?'target':''}" data-act="sentence" data-id="${id}" aria-label="Sentence ${+id.slice(1)}: ${esc(s.text)}"><span class="sid" aria-hidden="true">${+id.slice(1)}</span>${esc(s.text)}</button>`}).join('')}${e.id===D.sections.at(-1).id?`<p style="padding-left:30px">${esc(D.meta.signature)}</p>`:''}</div><p class="reading-guide">Yellow marks the sentence or evidence in focus. Select any sentence to explore its wording and effect. Use the story’s wording as evidence. The margin annotations are available from the link above.</p><div class="reading-foot"><button data-act="article">Read full article</button><span><button data-act="smaller" aria-label="Decrease passage text size" ${state.size===16?'disabled':''}>A−</button><button data-act="larger" aria-label="Increase passage text size" ${state.size===22?'disabled':''}>A+</button></span></div></section>`;}
const sceneFor=id=>{const n=+id.slice(1);return n===1?'memo':n<=5?'shelf':n<=9?'whale':n<=12?'shelf':n<=17?'numbers':n<=22?'shelf':'memo';};
const sceneInfo={memo:{title:'Behind the memo',alt:'An imagined office with a memo on the desk and a closed door.',caption:'A memo, a desk, a closed door.'},shelf:{title:'An ordinary task',alt:'An imagined storeroom shelf with a cleaning cloth and bucket.',caption:'A shelf, a cloth, a bucket.'},whale:{title:'On the shore',alt:'An imagined team working with straps beside a whale and a flatbed.',caption:'The whale, the team and the straps.'},numbers:{title:'In the break room',alt:'An imagined worker seated below a wall of tally marks.',caption:'An imagined break-room scene.'}};
function questionPicture(q){const id=sceneFor(q.section),info=sceneInfo[id];return `<figure class="question-picture"><button type="button" data-act="illustration" data-scene="${id}" aria-label="Enlarge illustration: ${esc(info.title)}"><img src="${ILLUSTRATIONS[id]}" alt="${esc(info.alt)}" width="1536" height="1024"><span class="picture-zoom" aria-hidden="true">View picture ↗</span></button><figcaption>${esc(info.caption)} <span>Artist’s interpretation. Answer from the text.</span></figcaption></figure>`;}
function illustration(id){if(!sceneInfo[id])return;const info=sceneInfo[id];openDialog(info.title,`<img class="photo illustration-full" src="${ILLUSTRATIONS[id]}" alt="${esc(info.alt)}"><p class="small-note">An AI-created illustration for this reading exercise. Appearance, setting and tally marks are imagined; the image supplies no additional facts about the story. Use the printed passage as evidence.</p>`,'illustration');}
function wordDownload(){const bytes=Uint8Array.from(atob(ANNOTATED_WORD),c=>c.charCodeAt(0)),u=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})),a=document.createElement('a');a.href=u;a.download='Exhortation-Annotated-Study-Copy.docx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function wordCard(){const p=count(),complete=p.done===p.total;return `<section class="word-card" aria-label="Marked-up Word copy"><div class="word-badge" aria-hidden="true">W</div><div><small>AFTER YOUR READING</small><h3>${complete?'Your marked-up reading copy':'Finish with a marked-up Word copy'}</h3><p>The complete article in its original paragraphs, in a full-width layout, with standard Word comments explaining devices, meanings and effects. Selected phrases and their comment headings use matching colours. Read this after your practice to compare your thinking.</p><p><a href="annotations.html">Read article with margin annotations</a></p>${btn('Download marked-up Word','word','')}<p class="small-note">Open Review → Show Comments in Word. Each coloured phrase matches the colour of its comment heading; sentence numbers also identify the references. ${complete?'You have attempted every question.':`${p.total-p.done} questions remain; you can also open the copy now for review.`}</p></div></section>`;}
function question(){const ids=list(),q=byQ[state.current],a=q?progress(q.id):null;if(!q||!ids.includes(q.id)){return `<section class="question section-summary"><h3>No questions in this view</h3><p>${state.filter==='missed'?'There are no current missed answers in this excerpt. Your original first responses remain in the progress report.':'Choose another excerpt or switch the question filter.'}</p>${btn('Show all questions','all')}${btn('View progress','report','quiet')}</section>`;}
const locked=a?.checked,selected=locked?a.choice:selection;return `<section class="question" aria-label="Question"><header class="pane-heading"><div><h2>Question ${ids.indexOf(q.id)+1} of ${ids.length} in this excerpt</h2><small>${order.indexOf(q.id)+1} / ${order.length} in the full reading</small></div>${btn('Read excerpt','read-excerpt','quiet mobile-reading')}</header><div class="question-main"><div class="skill">${esc(q.skill)}${q.sentenceId?' · sentence '+(+q.sentenceId.slice(1)):''}</div><h3 id="question-heading" tabindex="-1">${esc(q.prompt)}</h3>${questionPicture(q)}${q.sentenceId?`<blockquote class="focus">${esc(byS[q.sentenceId].text)}</blockquote>`:''}<div role="group" aria-label="Choose one answer">${q.options.map((s,i)=>`<div class="choice-row ${eliminated.has(i)&&!locked?'eliminated':''}"><button type="button" data-act="option" data-index="${i}" class="choice ${selected===i?'selected':''} ${locked&&i===q.answer?'correct':''} ${locked&&selected===i&&i!==q.answer?'incorrect':''}" aria-pressed="${selected===i}" ${locked||eliminated.has(i)?'disabled':''}><span class="letter" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${esc(s)}</span></button><button type="button" class="eliminate" data-act="eliminate" data-index="${i}" aria-label="${eliminated.has(i)?'Restore':'Eliminate'} choice ${String.fromCharCode(65+i)}" ${locked?'disabled':''}>${eliminated.has(i)?'+':'×'}</button></div>`).join('')}</div>${hintOpen?`<aside class="hint" role="note"><strong>A hint, not an answer</strong>${esc(q.hint)}</aside>`:''}${locked?feedback(q,a):''}<div class="q-actions">${btn(hintOpen?'Hide hint':'Show hint','hint','quiet',locked?'disabled':'')}${locked?btn(nextLabel(q),'next',''):btn('Check answer','check','',selection===null?'disabled':'')}</div><p class="small-note">${a?`Your first response is kept${a.firstAssisted?' with a hint recorded':''}, even if you retry.`:'One best answer. Use the text to choose; the choice labels are not clues.'}</p>${locked&&!a.lastCorrect?btn('Try this question again','retry','quiet'):''}</div></section>`;}
function feedback(q,a){return `<div class="feedback ${a.lastCorrect?'':'wrong'}" role="status" tabindex="-1"><h4>${a.lastCorrect?'That reading fits the evidence.':'Let’s look at the wording.'}</h4><p>${!a.lastCorrect?`<strong>Best answer: ${String.fromCharCode(65+q.answer)}.</strong> `:''}${esc(q.why)}</p><p class="helped">${a.attempts>1?'Attempt '+a.attempts+'. Original first response: '+(a.firstChoice===q.answer?'correct':'needs review')+'. ':''}Practice feedback, not a school grade.</p><details><summary>Why the other choices don’t fit</summary><ul>${q.options.map((s,i)=>i===q.answer?'':`<li><strong>${String.fromCharCode(65+i)}.</strong> ${esc(s)}<br>${esc(q.reasons[i])}</li>`).join('')}</ul></details></div>`;}
function nextLabel(q){const all=order.filter(id=>included(byQ[id])||id===q.id),n=all.indexOf(q.id);return n===all.length-1?'Finish & get Word copy':byQ[all[n+1]].section===q.section?'Next question':'Next excerpt';}
function render(focus=false){const p=count(),e=byE[state.section],q=byQ[state.current];document.body.classList.toggle('theme-dark',state.dark);$('#app').innerHTML=`<header class="top"><div class="identity"><span class="mark" aria-hidden="true"><i></i><i></i></span><div><strong>Reading Lab</strong><small>Close reading, one excerpt at a time</small></div></div><div class="top-actions"><span class="status">${saveOK?'Saved in this browser':'Storage unavailable · use Export'}</span>${btn('Glossary','glossary','quiet')}${btn('Progress','report','quiet')}${btn('About & sources','about','quiet wide')}${btn(state.dark?'Light':'Dark','theme','quiet')}</div></header><div class="subbar"><div><h1>Exhortation</h1><p>George Saunders · annotated close reading</p></div><div class="overall"><span>${p.done} of ${p.total} questions answered</span><div class="bar" role="progressbar" aria-label="Reading questions answered" aria-valuemin="0" aria-valuemax="${p.total}" aria-valuenow="${p.done}"><i style="width:${p.done/p.total*100}%"></i></div></div></div><main class="layout"><nav class="rail" aria-label="Article excerpts"><h2>The whole article</h2>${D.sections.map((e,i)=>{const p=count(e.questionIds);return `<button data-act="section" data-id="${e.id}" class="${e.id===state.section?'active':''}" ${e.id===state.section?'aria-current="page"':''}><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(e.title)}</span><small>${p.done}/${p.total} answered · source page ${e.page}</small></button>`}).join('')}</nav><div class="workspace"><div class="study-tools"><label class="part-picker" for="excerpt-picker"><span class="screen-reader">Choose excerpt</span><select id="excerpt-picker" aria-label="Choose excerpt">${D.sections.map((s,i)=>`<option value="${s.id}" ${s.id===state.section?'selected':''}>${i+1}. ${esc(s.title)}</option>`).join('')}</select></label><label for="question-filter">Practise<select id="question-filter"><option value="all" ${state.filter==='all'?'selected':''}>All questions</option><option value="meaning" ${state.filter==='meaning'?'selected':''}>Close reading</option><option value="devices" ${state.filter==='devices'?'selected':''}>Devices & inference</option><option value="missed" ${state.filter==='missed'?'selected':''}>Review current misses</option></select></label><button class="source-link" data-act="article">Full article & paragraph map</button></div><div class="panes">${reading(q)}${question()}</div><nav class="question-strip" aria-label="Questions in this excerpt">${list().map((id,i)=>`<button data-act="jump" data-id="${id}" class="${id===state.current?'current':''} ${progress(id)?progress(id).lastCorrect?'right':'miss':''}" aria-label="Question ${i+1}: ${esc(byQ[id].skill)}${progress(id)?progress(id).lastCorrect?', answered correctly':', needs review':''}" ${id===state.current?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav></div></main><footer class="footer">MicroQuest Reading Lab. Original study questions inspired by Freckle’s reading flow. Responses save in this browser. This is an independent study resource; no automatic essay grade is awarded. <button class="source-link" data-act="about">Sources & coverage</button></footer>`;const highlighted=$('.excerpt .target'),excerpt=$('.excerpt');if(highlighted&&excerpt)excerpt.scrollTop=Math.max(0,highlighted.offsetTop-excerpt.offsetTop-12);if(focus){$('#question-heading')?.focus({preventScroll:true});if(window.innerWidth<681)$('#question-heading')?.scrollIntoView({block:'start'});} }
function openDialog(title,body,type){dialogType=type;const d=$('#reading-dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2>${btn('Close','close-dialog','quiet')}</div><div class="dialog-body">${body}</div>`;if(!d.open)d.showModal();d.querySelector('[data-act="close-dialog"]')?.focus();}
function article(){let html=`<p class="source-details">${esc(D.meta.note)}</p><h3>${esc(D.meta.title)} by ${esc(D.meta.author)}</h3><p style="white-space:pre-line;font-size:12px">${esc(D.meta.header)}</p>`;for(const para of [...new Set(D.sentences.map(s=>s.paragraph))]){const ss=D.sentences.filter(s=>s.paragraph===para);html+=`<h3>Original paragraph ${para}</h3><p class="full-text">${ss.map(s=>`<button class="article-sentence" data-act="sentence" data-id="${s.id}" aria-label="Practise sentence ${+s.id.slice(1)}">${esc(s.text)}</button>`).join(' ')}</p>`;}html+=`<p>${esc(D.meta.signature)}</p><p class="small-note">Select any sentence above to return to its close-reading question. The two continuation points across the photos are joined in this transcription.</p>`;openDialog('Full article & paragraph map',html,'article');}
function glossary(query=''){const terms=D.terms.filter(t=>(t.term+' '+t.meaning).toLowerCase().includes(query.toLowerCase()));const html=terms.map(t=>`<div><dt>${esc(t.term)}</dt><dd>${esc(t.meaning)}</dd></div>`).join('');if(dialogType==='glossary'&&$('#glossary-terms')){$('#glossary-terms').innerHTML=html;return;}openDialog('Words & reading tools',`<label class="screen-reader" for="glossary-search">Find a word or device</label><input type="search" id="glossary-search" placeholder="Find a word or device"><dl class="glossary" id="glossary-terms">${html}</dl><p class="small-note">Definitions are learning aids. Todd’s label “neurotic” is not treated as a verified clinical diagnosis.</p>`,'glossary');}
function about(){openDialog('Sources, coverage & how to use this preview',`<h3>Read, choose, explain</h3><p>Read the short excerpt. Yellow highlights the sentence or evidence in focus. Choose one answer, eliminate distractions if useful, and check. Explanations appear after checking. Hints are optional and their use is recorded. Retry a mistake while keeping the original first response in your report.</p><h3>Analytical question edition</h3><p>Questions ask what wording reveals about character, tone, power, persuasion and theme. Each item has plausible choices with closely matched lengths. Earlier practice responses remain in their separate browser record and are not regraded against changed questions.</p><h3>Whole-text coverage</h3><p>${D.sections.length} excerpts cover all four supplied photos, including the final reassurance and signature. Every one of the ${D.sentences.length} numbered reading units has its own analytical close-reading question; ${D.questions.length-D.sentences.length} additional questions practise devices, inference, and whole-text interpretation. All ${D.questions.length} questions have four to six choices. The source header and signature remain in the reader.</p><p>The unusually long sentences, small rhetorical fragments, lowercase continuations and final comma have been retained. Questions about a fragment use its surrounding sentences. Spelling and punctuation are transcribed from the photos; line wrapping, quotation style and dashes are normalised for screen reading.</p><h3>Separate source layers</h3><p>The printed Saunders story is the reading text. Handwritten marginal comments are interpretations to test, not authorial wording or a binding answer key. The printed vocabulary and cultural notes below the story are supplementary worksheet material, not part of Todd’s memo.</p><h3>Printed worksheet support notes</h3><p><strong>Vocabulary in the supplied page:</strong> Tacitly — understood without being said. Neurotic — overly anxious or emotionally unstable. De facto — existing in fact, even if not officially recognized. Disconsolate — deeply unhappy or hopeless. Exhortation — a strong urging or encouragement (also the story’s title).</p><p>The worksheet describes a corporate memo with a fake positive tone; explains “whistle while you work” as remaining cheerful even at an unpleasant job; identifies Room 6 as implied dark or unethical work whose details remain unsaid; and connects the Break Room figures with satire of productivity culture. These are support notes. The questions test them against the printed story, and do not turn an implied exact method or organisation into an explicit fact.</p><h3>Pictures and the Word study copy</h3><p>Four original AI-created editorial illustrations are paired with the story’s scenes. They are visual interpretations, not additional textual evidence: appearances, room details and tally marks are imagined. Select a picture to enlarge it. The final question opens your progress and the marked-up Word download, which preserves the eight original paragraphs, in a full-width layout with 81 standard Word comments. Selected phrases and their corresponding comment headings use matching colours and sentence references. Open Review → Show Comments in Word to read the annotations. It is also available from Progress.</p><h3>Freckle research</h3><p>The public <a href="https://support.renaissance.com/s/article/What-is-ELA-Skills-Practice-and-how-do-I-implement-it-1752678745855?language=en_US" target="_blank" rel="noopener">official Freckle Skills Practice guide and example</a> were reviewed on 1 November 2026. The relevant observed features were passage-left/question-right layout, a focused reading skill, hints, and answer elimination. This reading lab uses original questions and its own design. It does not claim Freckle’s adaptive placement, validated reading levels, or licensed content.</p><h3>Your practice record</h3><p>This reading lab is published within MicroQuest. Answers and private backups stay in this browser; they are not submitted to a school or synced to a MicroQuest account. The source photographs and handwritten marginalia are not included in this public page.</p>`,'about');}
function photos(page=sourcePage){sourcePage=Math.min(4,Math.max(1,+page||1));openDialog('Supplied source photo '+sourcePage,`<nav class="photo-nav" aria-label="Source photos">${[1,2,3,4].map(n=>btn('Page '+n,'photo','secondary '+(n===sourcePage?'selected':''),`data-page="${n}"`)).join('')}</nav><p class="small-note">Original photograph with its marginal annotations. Compare the printed wording with the reading text.</p><img class="photo" src="${PHOTO_SOURCES[sourcePage]}" alt="User-supplied source photograph ${sourcePage} of Exhortation">`,'photo');}
function report(){const p=count();const skills=[...new Set(D.questions.map(q=>q.skill))];openDialog(p.done===p.total?'Reading complete':'Your reading progress',`${wordCard()}<p><strong>${p.done}/${p.total}</strong> questions attempted. <strong>${p.right}/${p.done||0}</strong> first responses correct. <strong>${p.missed}</strong> current answers to review. Completion is practice evidence, not a certified reading level.</p><p class="small-note">First responses remain unchanged after retries. A question with a hint before its first submission is counted as assisted. Corrected answers remove current misses without rewriting your first-response record.</p><table class="report-table"><thead><tr><th>Skill</th><th>Attempted</th><th>First correct</th><th>Hint used first</th></tr></thead><tbody>${skills.map(skill=>{const ids=D.questions.filter(q=>q.skill===skill).map(q=>q.id),p=count(ids);return `<tr><th scope="row">${esc(skill)}</th><td>${p.done}/${p.total}</td><td>${p.right}/${p.done}</td><td>${ids.filter(id=>progress(id)?.firstAssisted).length}</td></tr>`;}).join('')}</tbody></table><h3>Excerpt coverage</h3><table class="report-table"><thead><tr><th>Excerpt</th><th>Questions</th><th>Close reading</th></tr></thead><tbody>${D.sections.map((s,i)=>`<tr><td><button class="source-link" data-act="section" data-id="${s.id}">${i+1}. ${esc(s.title)}</button></td><td>${count(s.questionIds).done}/${s.questionIds.length}</td><td>${s.sentenceIds.filter(id=>answered('m-'+id)).length}/${s.sentenceIds.length}</td></tr>`).join('')}</tbody></table><div class="q-actions">${btn('Review current misses','review','secondary')}${btn('Export private backup','export','secondary')}</div><p class="small-note">This report contains no student name and is not submitted to a school.</p>`,'report');}
function close(){if($('#reading-dialog').open)$('#reading-dialog').close();dialogType='';}
function next(){const current=state.current;const ids=order.filter(id=>included(byQ[id])||id===current),n=ids.indexOf(current);if(n<ids.length-1)jump(ids[n+1]);else report();}
function check(){const q=byQ[state.current];if(!q||selection===null||progress(q.id)?.checked)return;const old=progress(q.id);state.answers[q.id]={firstChoice:old?old.firstChoice:selection,firstAssisted:old?old.firstAssisted:!!state.hints[q.id],firstAt:old?.firstAt||new Date().toISOString(),choice:selection,checked:true,attempts:(old?.attempts||0)+1,hintUsed:!!old?.hintUsed||hintOpen,lastCorrect:selection===q.answer};save();render();$('.feedback')?.focus({preventScroll:true});$('.feedback')?.scrollIntoView({block:'nearest',behavior:'instant'});}
const download=(name,value)=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([value],{type:'application/json'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const act=el.dataset.act;switch(act){case'section':close();chooseSection(el.dataset.id);break;case'jump':jump(el.dataset.id);break;case'sentence':close();state.filter='all';jump('m-'+el.dataset.id);break;case'option':selection=+el.dataset.index;render();$(`[data-act="option"][data-index="${selection}"]`)?.focus({preventScroll:true});break;case'eliminate':{const i=+el.dataset.index;if(eliminated.has(i))eliminated.delete(i);else{eliminated.add(i);if(selection===i)selection=null;}render();$(`[data-act="eliminate"][data-index="${i}"]`)?.focus({preventScroll:true});break;}case'check':check();break;case'hint':hintOpen=!hintOpen;if(hintOpen){state.hints||={};state.hints[state.current]=true;save();}render();break;case'next':next();break;case'retry':state.answers[state.current].checked=false;state.answers[state.current].hintUsed=true;selection=null;eliminated=new Set();save();render();break;case'all':state.filter='all';chooseSection(state.section);break;case'review':close();state.filter='missed';{const id=order.find(id=>included(byQ[id]));if(id)jump(id);else{state.current=null;save();render();}}break;case'article':article();break;case'glossary':glossary();break;case'report':report();break;case'about':about();break;case'illustration':illustration(el.dataset.scene);break;case'word':wordDownload();break;case'close-dialog':close();break;case'theme':state.dark=!state.dark;save();render();break;case'smaller':state.size=Math.max(16,state.size-2);save();render();break;case'larger':state.size=Math.min(22,state.size+2);save();render();break;case'read-excerpt':$('.reading')?.scrollIntoView({block:'start'});break;case'export':download('exhortation-reading-progress.json',JSON.stringify(state,null,2));break;}});
document.addEventListener('change',e=>{if(e.target.id==='excerpt-picker')chooseSection(e.target.value);if(e.target.id==='question-filter'){state.filter=e.target.value;const ids=list();state.current=ids[0]||null;selection=state.current&&progress(state.current)?.checked?progress(state.current).choice:null;eliminated=new Set();hintOpen=false;save();render();}});
document.addEventListener('input',e=>{if(e.target.id==='glossary-search')glossary(e.target.value);});
$('#reading-dialog').addEventListener('click',e=>{if(e.target!==$('#reading-dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});
selection=progress(state.current)?.checked?progress(state.current).choice:null;render();
})();
</script></body></html>
